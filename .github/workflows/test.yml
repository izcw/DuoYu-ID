name: Authentication regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: duoyu
          POSTGRES_USER: duoyu
          POSTGRES_PASSWORD: ci_disposable_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U duoyu"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUOYU_TEST_DATABASE_URL: postgres://duoyu:ci_disposable_only@localhost:5432/duoyu?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: go test -count=1 -v ./...
      - run: go vet ./...
      - run: pnpm --dir admin install --frozen-lockfile
      - run: pnpm --dir admin build
      - run: pnpm --dir admin exec playwright install --with-deps chromium
      - name: Browser regression without SMTP
        working-directory: admin
        run: node tests/ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: test-results/
