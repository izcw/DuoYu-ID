services:
  postgres:
    image: postgres:17-alpine
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_DB: duoyu
      POSTGRES_USER: duoyu
      POSTGRES_PASSWORD: duoyu_dev_only
    volumes: ["dev-postgres:/var/lib/postgresql/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
volumes:
  dev-postgres:
