services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: duoyu
      POSTGRES_USER: duoyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U duoyu -d duoyu"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:5252:5252"]
    env_file: .env
    environment:
      DUOYU_ADDR: :5252
      DATABASE_URL: postgres://duoyu:${POSTGRES_PASSWORD}@postgres:5432/duoyu?sslmode=disable
      DUOYU_DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
  app-data:
