<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" /><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="{{assetURL `/login-ui/message.css`}}"><meta name="color-scheme" content="light"><title>登录 · 多鱼账号 DuoYu ID</title>
<link rel="stylesheet" href="{{assetURL `/auth/base.css`}}"><link rel="stylesheet" href="{{assetURL `/auth/login.css`}}"></head><body>

<div class="shell">
<main class="formside"><div class="brand-row">{{if .RequestID}}<div class="brand projectbrand" aria-label="接入项目"><img class="brand-logo app-logo" src="{{if .Logo}}{{.Logo}}{{else}}/project-default.svg{{end}}" alt="" referrerpolicy="no-referrer"><div class="project-name" title="{{.App}}">{{.App}}</div></div><span class="brand-separator" aria-hidden="true">·</span>{{end}}<div class="brand mobilebrand"><img class="brand-logo" src="/logo.png" alt=""><div>多鱼账号<small>DUOYU ID</small></div></div></div><div class="card"><h2 id="heading">登录</h2><p class="subtitle hidden" id="subtitle"></p>
<div id="session" class="hidden"><div class="current"><strong id="current-name"></strong><span id="current-email"></span></div><p class="resetnote" id="scope-note">继续后，应用将获得你允许提供的身份资料。</p><button id="continue" class="primary">继续使用</button><div class="minor"><button class="link" id="switch">换个账号登录</button></div></div>
<section id="qr-panel" class="hidden" aria-label="扫码登录"><div class="qr-stage"><img id="qr-image" alt="手机扫码登录二维码" class="hidden"><button id="qr-refresh" class="hidden" type="button">二维码已过期<br>点击刷新</button></div><p id="qr-status" role="status">正在生成二维码…</p><p id="qr-code-label"></p><p id="qr-local" class="hidden">扫码验证需要手机和电脑都能访问同一 HTTPS 域名。</p><button id="qr-device" type="button" class="passkey hidden">直接验证登录</button><p id="qr-device-note" class="hidden" role="status"></p><a id="qr-device-secure" class="passkey hidden" href="{{.Origin}}/login">使用 HTTPS 账号中心</a><button id="qr-back" type="button" class="passkey">返回登录方式</button></section><p id="no-methods" class="resetnote hidden">该项目暂未开放登录，请联系项目管理员。</p><form id="authenticator-form" class="hidden"><label class="field" for="authenticator-account">邮箱或账号 ID</label><input id="authenticator-account" class="code" autocomplete="username" maxlength="254" placeholder="邮箱或 10 位账号 ID" required><div style="margin-top:18px"><label class="field" for="authenticator-code">动态验证码或恢复码</label><input id="authenticator-code" class="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="6 位动态验证码" required></div><p class="resetnote">打开 Microsoft Authenticator 等已绑定的身份验证器查看动态码。</p><button class="primary" type="submit" id="authenticator-submit">登录</button><div class="minor"><button type="button" class="link" id="authenticator-back">返回登录方式</button><button type="button" class="link" id="authenticator-recovery">使用恢复码</button></div></form><form id="form"><div id="email-login"><div class="tabs"><button type="button" class="tab active" data-mode="code">邮箱验证码</button><button type="button" class="tab" data-mode="password">密码登录</button></div><label class="field" for="email">邮箱地址</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="请输入邮箱" maxlength="254" autocapitalize="none" spellcheck="false"><div id="pw-wrap" class="hidden"><label class="field" for="password">密码</label><div class="password-field"><input id="password" type="password" autocomplete="off" data-lpignore="true" data-1p-ignore maxlength="128" placeholder="请输入密码"><button type="button" id="toggle-password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="m3 21 18-18"/></svg></button></div></div><div id="code-wrap"><label class="field" for="code">邮箱验证码</label><div class="codewrap"><input class="code" id="code" inputmode="numeric" autocomplete="off" data-lpignore="true" data-1p-ignore maxlength="6" pattern="[0-9]{6}" required placeholder="6 位验证码"><button type="button" class="send" id="send">获取验证码</button></div></div><button type="submit" class="primary" id="submit">登录/注册</button><div class="minor"><span></span><button type="button" class="link" id="reset">忘记密码？</button></div></div><div id="alternative"><div class="divider">或使用其他方式</div><div class="login-methods"><button type="button" class="passkey" id="passkey" aria-label="使用通行密钥登录"><img class="method-icon" src="/passkey.png" alt=""><span>通行密钥</span></button><button type="button" id="qr-open" class="passkey" aria-label="iPhone 扫码登录"><img class="method-icon" src="/iphone.png" alt=""><span>iPhone</span></button><button type="button" id="authenticator-open" class="passkey" aria-label="身份验证器登录"><img class="method-icon" src="/authenticator.png" alt=""><span>身份验证器</span></button></div></div></form></div></main></div><footer class="site-footer">多鱼账号 · DuoYu ID</footer>
<script src="{{assetURL `/login-ui/message.js`}}"></script><script>
document.querySelectorAll('.app-logo').forEach(img=>img.addEventListener('error',()=>{img.src='/project-default.svg'},{once:true}));
const loginMethods={{.LoginMethods}};const $=id=>document.getElementById(id);let mode='code',reset=false,busy=false;const requestId=new URLSearchParams(location.search).get('authRequestID')||'';
function message(text,success=false){DuoyuLoginMessage.show(text,success)}
async function api(path,data){const res=await fetch(path,{method:data===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Duoyu-Request':'1','X-Duoyu-Auth-Request':requestId},body:data===undefined?undefined:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw Error(out.msg||'请求失败');return out.data}
function select(value){if(!reset&&!loginMethods.includes(value))value=loginMethods.includes('code')?'code':'password';mode=value;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===value));$('pw-wrap').classList.toggle('hidden',value==='code'&&!reset);$('code-wrap').classList.toggle('hidden',value==='password'&&!reset);$('code').disabled=value==='password'&&!reset;$('password').required=value==='password'||reset;$('submit').textContent=reset?'重置密码':value==='code'?'登录/注册':'登录';$('heading').textContent=reset?'重置密码':'登录';$('subtitle').textContent=reset?'验证邮箱后设置新密码':'';$('subtitle').classList.toggle('hidden',!reset);$('alternative').classList.toggle('hidden',reset||!loginMethods.some(m=>m==='passkey'||m==='qr'||m==='totp'));$('password').autocomplete='off';$('password').placeholder=reset?'设置 6–64 个字符的新密码':'请输入密码';$('reset').textContent=reset?'返回登录':'忘记密码？';message('')}
$('toggle-password').onclick=()=>{const show=$('password').type==='password';$('password').type=show?'text':'password';$('eye-slash').style.display=show?'none':'';$('toggle-password').setAttribute('aria-label',show?'隐藏密码':'显示密码');$('toggle-password').setAttribute('aria-pressed',String(show))};$('code').oninput=()=>{$('code').value=$('code').value.replace(/\D/g,'')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{reset=false;select(b.dataset.mode)});$('reset').onclick=()=>{reset=!reset;$('password').value='';$('code').value='';select(reset?'password':loginMethods.includes('code')?'code':'password')};
$('send').onclick=async()=>{if(!$('email').reportValidity())return;const b=$('send');b.disabled=true;try{const receipt=await api('/api/auth/code',{email:$('email').value,purpose:reset?'reset':'login',auth_request_id:requestId});let n=60;b.textContent=n+' 秒后重发';const timer=setInterval(()=>{n--;b.textContent=n+' 秒后重发';if(n<=0){clearInterval(timer);b.disabled=false;b.textContent='获取验证码'}},1000);message(receipt.local_mail?'验证码已进入本机测试收件箱（localhost:18025），不会发送到真实邮箱。':'邮件请求已提交，请检查收件箱或垃圾邮件。',true);$('code').focus()}catch(e){message(e.message);b.disabled=false}};
async function proceed(confirmed=false){if(requestId){const context=await api('/api/auth/context?id='+encodeURIComponent(requestId));if(context.consent&&!confirmed){const state=await api('/api/auth/session');$('current-name').textContent=state.user.name;$('current-email').textContent=state.user.email;$('scope-note').textContent='允许 '+context.name+' 获取所申请的身份资料'+(context.scopes.includes('offline_access')?'，并在本次中心会话期间续期登录':'')+'。';$('form').classList.add('hidden');$('authenticator-form').classList.add('hidden');$('qr-panel').classList.add('hidden');$('session').classList.remove('hidden');return}const out=await api('/api/auth/continue',{id:requestId});location.assign(out.redirect)}else{location.assign('/#/account/profile')}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('submit').disabled=true;$('submit').textContent=reset?'正在重置…':'正在登录…';message('');try{if(reset && ([...$('password').value].length < 6 || [...$('password').value].length > 64))throw Error('密码须为 6–64 个字符');if(reset){await api('/api/auth/reset',{email:$('email').value,code:$('code').value,password:$('password').value});reset=false;select('password');message('密码已重置，请重新登录。',true)}else{await api('/api/auth/login',{email:$('email').value,password:$('password').value,code:$('code').value,mode,auth_request_id:requestId});await proceed()}}catch(e){message(e.message)}finally{busy=false;$('submit').disabled=false;$('submit').textContent=reset?'重置密码':mode==='code'?'登录/注册':'登录'}};
$('continue').onclick=async()=>{try{$('continue').disabled=true;await proceed(true)}catch(e){message(e.message);$('continue').disabled=false}};
$('switch').onclick=async()=>{try{await api('/api/auth/logout',{});$('session').classList.add('hidden');$('form').classList.remove('hidden');message('')}catch(e){message(e.message)}};
const buf=v=>Uint8Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const b64=v=>btoa(String.fromCharCode(...new Uint8Array(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
async function loginWithPasskey(b,qrDevice=false){b.disabled=true;try{if(!window.isSecureContext)throw Error('当前页面使用不安全的 HTTP 地址，Chrome 无法调用通行密钥。请通过 HTTPS 账号中心登录；本地开发请使用 localhost。');if(typeof navigator.credentials?.get!=='function')throw Error('当前浏览器未提供通行密钥功能，请检查浏览器版本或安全策略，或使用邮箱登录。');const options=await api(qrDevice?'/api/auth/qr/device/begin':'/api/auth/passkey/begin',{});const p=options.publicKey;if(qrDevice)p.hints=['client-device'];p.challenge=buf(p.challenge);if(p.allowCredentials)p.allowCredentials.forEach(c=>c.id=buf(c.id));const c=await navigator.credentials.get({publicKey:p});if(!c)throw Error('操作已取消');await api(qrDevice?'/api/auth/qr/device/finish':'/api/auth/passkey/finish',{id:c.id,rawId:b64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,clientExtensionResults:c.getClientExtensionResults(),response:{clientDataJSON:b64(c.response.clientDataJSON),authenticatorData:b64(c.response.authenticatorData),signature:b64(c.response.signature),userHandle:c.response.userHandle?b64(c.response.userHandle):null}});if(qrDevice)stopQR();await proceed()}catch(e){message(e.name==='NotAllowedError'?'通行密钥操作已取消或超时。':e.message)}finally{b.disabled=false}}
$('passkey').onclick=()=>loginWithPasskey($('passkey'));
$('qr-device').onclick=()=>loginWithPasskey($('qr-device'),true);
const appleDevice=/iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(navigator.userAgent)||/iPhone|iPad|Mac/i.test(navigator.platform||'')||navigator.userAgentData?.platform==='macOS';
const canVerifyDevice=window.isSecureContext&&typeof window.PublicKeyCredential!=='undefined'&&typeof navigator.credentials?.get==='function';
$('qr-device').classList.toggle('hidden',!appleDevice);
$('qr-device').disabled=!canVerifyDevice;
$('qr-device-note').classList.toggle('hidden',!appleDevice||canVerifyDevice);
if(appleDevice&&!canVerifyDevice){$('qr-device-note').textContent=!window.isSecureContext?'当前使用 HTTP，无法调用 iPhone / Mac 的通行密钥。请使用 HTTPS 账号中心打开后直接验证，无需扫描自己的二维码。':'当前浏览器未提供通行密钥功能，请在 Safari 中打开 HTTPS 账号中心。';const secureOrigin={{.Origin}};if(secureOrigin.startsWith('https://'))$('qr-device-secure').classList.remove('hidden')}

(async()=>{try{const session=await api('/api/auth/session');if(!session.authenticated)return;if(requestId){const check=await api('/api/auth/context?id='+encodeURIComponent(requestId));if(check.reauthenticate){$('email').value=session.user.email;return}}const user=session.user;$('current-name').textContent=user.name;$('current-email').textContent=user.email;$('session').classList.remove('hidden');$('form').classList.add('hidden');if(requestId){const context=await api('/api/auth/context?id='+encodeURIComponent(requestId));const fields=['用户标识'];if(context.scopes.includes('profile'))fields.push('昵称、头像');if(context.scopes.includes('email'))fields.push('邮箱');if(context.scopes.includes('offline_access'))fields.push('本次会话期间续期登录');$('scope-note').textContent='继续后，'+context.name+' 将获得：'+fields.join('、')+'。'}else{$('scope-note').classList.add('hidden')}}catch{}})();

let qrID='',qrEpoch=0,qrPollTimer,qrClockTimer;
function stopQR(){clearTimeout(qrPollTimer);clearInterval(qrClockTimer);qrEpoch++;if(qrID){api('/api/auth/qr/'+qrID+'/cancel',{}).catch(()=>{});qrID=''}}
async function startQR(){stopQR();const epoch=qrEpoch;$('form').classList.add('hidden');$('qr-panel').classList.remove('hidden');$('heading').textContent='扫码登录';$('qr-image').classList.add('hidden');$('qr-refresh').classList.add('hidden');$('qr-local').classList.add('hidden');$('qr-status').textContent='正在生成二维码…';$('qr-code-label').textContent='';message('');try{const out=await api('/api/auth/qr',{});if(epoch!==qrEpoch){api('/api/auth/qr/'+out.id+'/cancel',{}).catch(()=>{});return}qrID=out.id;$('qr-image').src=out.image;$('qr-image').classList.remove('hidden');$('qr-code-label').textContent='识别码 '+out.label;$('qr-local').classList.toggle('hidden',!out.local_only);let scanned=false;const deadline=Date.parse(out.expires_at);function expired(text){clearTimeout(qrPollTimer);clearInterval(qrClockTimer);$('qr-status').textContent=text;$('qr-refresh').classList.remove('hidden')}function tick(){const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){expired('二维码已过期');return}$('qr-status').textContent=scanned?'已扫码，请在手机验证并确认':'使用 iPhone 系统相机扫码 · '+left+' 秒后过期'}tick();qrClockTimer=setInterval(tick,1000);async function poll(){if(epoch!==qrEpoch||Date.now()>=deadline)return;try{const state=await api('/api/auth/qr/'+out.id+'/poll',{});if(epoch!==qrEpoch)return;if(state.status==='approved'){qrID='';stopQR();await proceed();return}if(state.status==='expired'||state.status==='rejected'){expired(state.status==='rejected'?'手机已拒绝此次登录':'二维码已过期');return}scanned=state.status==='scanned';tick();qrPollTimer=setTimeout(poll,1800)}catch(e){if(epoch===qrEpoch)expired(e.message)}}qrPollTimer=setTimeout(poll,1800)}catch(e){if(epoch===qrEpoch){$('qr-status').textContent=e.message;$('qr-refresh').classList.remove('hidden')}}}
$('qr-open').onclick=startQR;$('qr-refresh').onclick=startQR;$('qr-back').onclick=()=>{stopQR();$('qr-panel').classList.add('hidden');$('form').classList.remove('hidden');select(mode)};window.addEventListener('pagehide',()=>{clearTimeout(qrPollTimer);clearInterval(qrClockTimer)});
const emailAllowed=loginMethods.some(m=>m==='code'||m==='password');
$('email-login').classList.toggle('hidden',!emailAllowed);
document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('hidden',!loginMethods.includes(b.dataset.mode)));
$('passkey').classList.toggle('hidden',!loginMethods.includes('passkey'));
$('qr-open').classList.toggle('hidden',!loginMethods.includes('qr'));
$('reset').classList.toggle('hidden',!loginMethods.includes('password'));
$('alternative').querySelector('.divider').classList.toggle('hidden',!emailAllowed);
$('no-methods').classList.toggle('hidden',loginMethods.length!==0);
$('authenticator-open').classList.toggle('hidden',!loginMethods.includes('totp'));
let authenticatorRecovery=false;
$('authenticator-open').onclick=()=>{$('form').classList.add('hidden');$('authenticator-form').classList.remove('hidden');$('heading').textContent='身份验证器登录';$('authenticator-account').focus();message('')};
$('authenticator-back').onclick=()=>{$('authenticator-form').classList.add('hidden');$('form').classList.remove('hidden');$('heading').textContent='登录';message('')};
$('authenticator-recovery').onclick=()=>{authenticatorRecovery=!authenticatorRecovery;const c=$('authenticator-code');c.value='';c.maxLength=authenticatorRecovery?32:6;c.inputMode=authenticatorRecovery?'text':'numeric';c.pattern=authenticatorRecovery?'[A-Za-z0-9-]{16,32}':'[0-9]{6}';c.placeholder=authenticatorRecovery?'输入一个未使用的恢复码':'6 位动态验证码';$('authenticator-recovery').textContent=authenticatorRecovery?'使用动态验证码':'使用恢复码'};
$('authenticator-form').onsubmit=async e=>{e.preventDefault();const b=$('authenticator-submit');if(b.disabled)return;b.disabled=true;try{await api('/api/auth/authenticator',{account:$('authenticator-account').value,code:$('authenticator-code').value,recovery:authenticatorRecovery,auth_request_id:requestId});await proceed()}catch(e){message(e.message)}finally{b.disabled=false}};
select(loginMethods.includes('code')?'code':'password');
</script></body></html>
