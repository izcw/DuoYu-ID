<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/login-ui/message.css"><meta name="color-scheme" content="light"><title>登录 · 多鱼账号 Duoyu ID</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}a{color:inherit;text-decoration:none}.hidden{display:none!important}.shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:130px 24px 100px}.formside{width:420px;max-width:100%}.brand{position:absolute;left:36px;top:30px;display:flex;align-items:center;gap:12px;font-size:23px;font-weight:650}.brand small{display:none}.mark{display:grid;place-items:center;color:#111;width:40px;height:40px}.mark svg{width:40px;height:40px}.card h2{font-size:30px;font-weight:650;letter-spacing:-.5px;margin:0 0 32px;text-align:center}.card h2:before{content:'Duoyu ID';padding-right:20px;margin-right:20px;border-right:1px solid #111}.appbadge{font-size:13px;color:#8c929c;text-align:center;margin-bottom:20px}.subtitle{text-align:center;color:#9299a5;font-size:14px;margin:-22px 0 28px}.tabs{display:flex;gap:26px;margin-bottom:22px}.tab{border:0;background:none;color:#a0a6b1;font-size:14px;padding:0 0 9px;border-bottom:1px solid transparent}.tab.active{color:#111;border-bottom-color:#111}.field{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}input[type=email],.password-field input,input.code{width:100%;height:42px;border:1px solid #d9dce2;border-radius:5px;background:white;padding:0 14px;outline:none;color:#111;font-size:15px}input::placeholder{color:#a5adbb}input:focus{border-color:#666;box-shadow:0 0 0 2px #00000004}#pw-wrap,#code-wrap{margin-top:18px}.password-field{position:relative}.password-field input{padding-right:55px}.password-field button{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:0;background:none;color:#888;padding:7px;display:grid;place-items:center}.password-field button svg{width:21px;height:21px}.codewrap{display:flex;gap:12px}.codewrap input{min-width:0;letter-spacing:3px}.codewrap input::placeholder{letter-spacing:0}.send{height:42px;white-space:nowrap;border:1px solid #d9dce2;color:#222;background:#fff;border-radius:5px;padding:0 16px;font-size:13px}.send:hover{background:#fafafa}.primary{width:100%;height:42px;background:#000;color:#fff;border:1px solid #000;border-radius:5px;font-size:16px;font-weight:550;margin-top:26px}.primary:hover{background:#262626}.agree{display:flex;align-items:center;gap:7px;font-size:12px;color:#989fa9;margin-top:18px}.agree input{accent-color:#111}.minor{display:flex;justify-content:space-between;margin-top:24px}.link{border:0;padding:0;background:none;color:#222;font-size:13px}.divider{display:flex;align-items:center;gap:15px;margin:26px 0 16px;color:#b1b5bd;font-size:11px}.divider:before,.divider:after{content:'';height:1px;flex:1;background:#eee}.passkey{height:42px;width:100%;border:1px solid #dedfe3;border-radius:5px;background:#fff;color:#555;font-size:13px}.method-icon{width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-right:10px}.passkey:hover{background:#fafafa}.current{padding:20px;background:#fafafa;border:1px solid #e5e5e7;border-radius:5px}.current strong{display:block;margin-bottom:8px}.current span,.resetnote{font-size:13px;line-height:1.8;color:#8b919b}.site-footer{text-align:center;color:#a4a8b0;font-size:12px;margin-top:auto;padding:0 20px 28px}.shell{min-height:calc(100dvh - 48px)}button:focus-visible{outline:2px solid #555;outline-offset:4px}@media(max-width:600px){.shell{padding:130px 28px 60px;align-items:center}.brand{left:25px;top:25px;font-size:20px}.mark,.mark svg{width:32px;height:32px}.card h2{font-size:25px;margin-bottom:36px}.card h2:before{padding-right:16px;margin-right:16px}.tabs{margin-bottom:24px}.site-footer{font-size:11px}}
.qr-entry{margin-top:12px}.qr-stage{height:240px;width:240px;margin:12px auto 24px;position:relative}.qr-stage img{width:240px;height:240px;image-rendering:pixelated}.qr-stage button{position:absolute;inset:0;background:#ffffffee;color:#111;border:1px solid #ddd;line-height:1.9;border-radius:5px;font-size:14px}#qr-panel{text-align:center;min-height:390px}#qr-panel p{font-size:13px;line-height:1.8;color:#939aa5}#qr-code-label{letter-spacing:3px;color:#333!important}#qr-local{font-size:12px!important;color:#a06e36!important}#qr-back{margin-top:20px}.brand-logo{width:56px;height:38px;object-fit:contain;border-radius:4px}@media(max-width:600px){.brand-logo{width:44px;height:30px}}</style></head><body>

<div class="shell">
<main class="formside"><div class="brand mobilebrand"><img class="brand-logo" src="/logo.png" alt=""><div>多鱼账号<small>DUOYU ID</small></div></div><div class="card">{{if .RequestID}}<div class="appbadge">登录到 {{.App}}</div>{{end}}<h2 id="heading">登录</h2><p class="subtitle hidden" id="subtitle"></p>
<div id="session" class="hidden"><div class="current"><strong id="current-name"></strong><span id="current-email"></span></div><p class="resetnote" id="scope-note">继续后，应用将获得你允许提供的身份资料。</p><button id="continue" class="primary">继续使用</button><div class="minor"><button class="link" id="switch">换个账号登录</button></div></div>
<section id="qr-panel" class="hidden" aria-label="扫码登录"><div class="qr-stage"><img id="qr-image" alt="手机扫码登录二维码" class="hidden"><button id="qr-refresh" class="hidden" type="button">二维码已过期<br>点击刷新</button></div><p id="qr-status" role="status">正在生成二维码…</p><p id="qr-code-label"></p><p id="qr-local" class="hidden">当前为 localhost。手机扫码需部署到两端可访问的同一 HTTPS 域名。</p><button id="qr-back" type="button" class="link">返回邮箱登录</button></section><form id="form"><div class="tabs"><button type="button" class="tab active" data-mode="code">邮箱验证码</button><button type="button" class="tab" data-mode="password">密码登录</button></div><label class="field" for="email">邮箱地址</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="请输入邮箱" maxlength="254"><div id="pw-wrap" class="hidden"><label class="field" for="password">密码</label><div class="password-field"><input id="password" type="password" autocomplete="current-password" maxlength="128" placeholder="请输入密码"><button type="button" id="toggle-password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="m3 21 18-18"/></svg></button></div></div><div id="code-wrap"><label class="field" for="code">邮箱验证码</label><div class="codewrap"><input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="6 位验证码"><button type="button" class="send" id="send">获取验证码</button></div></div><button type="submit" class="primary" id="submit">登录</button><div class="minor"><span></span><button type="button" class="link" id="reset">忘记密码？</button></div><div id="alternative"><div class="divider">或使用其他方式</div><button type="button" class="passkey" id="passkey"><img class="method-icon" src="/passkey.png" alt="">使用通行密钥登录</button><button type="button" id="qr-open" class="passkey qr-entry"><img class="method-icon" src="/iphone.png" alt="">iPhone 扫码登录</button></div></form></div></main></div><footer class="site-footer">多鱼账号 · Duoyu ID</footer>
<script src="/login-ui/message.js"></script><script>
const $=id=>document.getElementById(id);let mode='code',reset=false,busy=false;const requestId=new URLSearchParams(location.search).get('authRequestID')||'';
function message(text,success=false){DuoyuLoginMessage.show(text,success)}
async function api(path,data){const res=await fetch(path,{method:data===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Duoyu-Request':'1'},body:data===undefined?undefined:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw Error(out.msg||'请求失败');return out.data}
function select(value){mode=value;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===value));$('pw-wrap').classList.toggle('hidden',value==='code'&&!reset);$('code-wrap').classList.toggle('hidden',value==='password'&&!reset);$('code').disabled=value==='password'&&!reset;$('password').required=value==='password'||reset;$('submit').textContent=reset?'重置密码':value==='code'?'登录':'登录';$('heading').textContent=reset?'重置密码':'登录';$('subtitle').textContent=reset?'验证邮箱后设置新密码':'';$('subtitle').classList.toggle('hidden',!reset);$('alternative').classList.toggle('hidden',reset);$('password').autocomplete=reset?'new-password':'current-password';$('password').placeholder=reset?'设置至少 12 位的新密码':'请输入密码';$('reset').textContent=reset?'返回登录':'忘记密码？';message('')}
$('toggle-password').onclick=()=>{const show=$('password').type==='password';$('password').type=show?'text':'password';$('eye-slash').style.display=show?'none':'';$('toggle-password').setAttribute('aria-label',show?'隐藏密码':'显示密码');$('toggle-password').setAttribute('aria-pressed',String(show))};$('code').oninput=()=>{$('code').value=$('code').value.replace(/\D/g,'')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{reset=false;select(b.dataset.mode)});$('reset').onclick=()=>{reset=!reset;select(reset?'password':'code')};
$('send').onclick=async()=>{if(!$('email').reportValidity())return;const b=$('send');b.disabled=true;try{const receipt=await api('/api/auth/code',{email:$('email').value,purpose:reset?'reset':'login'});let n=60;b.textContent=n+' 秒后重发';const timer=setInterval(()=>{n--;b.textContent=n+' 秒后重发';if(n<=0){clearInterval(timer);b.disabled=false;b.textContent='获取验证码'}},1000);message(receipt.local_mail?'验证码已进入本机测试收件箱（localhost:18025），不会发送到真实邮箱。':'邮件请求已提交，请检查收件箱或垃圾邮件。',true);$('code').focus()}catch(e){message(e.message);b.disabled=false}};
async function proceed(confirmed=false){if(requestId){const context=await api('/api/auth/context?id='+encodeURIComponent(requestId));if(context.consent&&!confirmed){const state=await api('/api/auth/session');$('current-name').textContent=state.user.name;$('current-email').textContent=state.user.email;$('scope-note').textContent='允许 '+context.name+' 获取所申请的身份资料'+(context.scopes.includes('offline_access')?'，并在本次中心会话期间续期登录':'')+'。';$('form').classList.add('hidden');$('qr-panel').classList.add('hidden');$('session').classList.remove('hidden');return}const out=await api('/api/auth/continue',{id:requestId});location.assign(out.redirect)}else{location.assign('/#/account/profile')}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('submit').disabled=true;message('');try{if(reset){await api('/api/auth/reset',{email:$('email').value,code:$('code').value,password:$('password').value});reset=false;select('password');message('密码已重置，请重新登录。',true)}else{await api('/api/auth/login',{email:$('email').value,password:$('password').value,code:$('code').value,mode});await proceed()}}catch(e){message(e.message)}finally{busy=false;$('submit').disabled=false}};
$('continue').onclick=async()=>{try{$('continue').disabled=true;await proceed(true)}catch(e){message(e.message);$('continue').disabled=false}};
$('switch').onclick=async()=>{try{await api('/api/auth/logout',{});$('session').classList.add('hidden');$('form').classList.remove('hidden');message('')}catch(e){message(e.message)}};
const buf=v=>Uint8Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const b64=v=>btoa(String.fromCharCode(...new Uint8Array(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
$('passkey').onclick=async()=>{const b=$('passkey');b.disabled=true;try{if(!window.PublicKeyCredential)throw Error('当前浏览器不支持通行密钥，请使用邮箱登录。');const options=await api('/api/auth/passkey/begin',{});const p=options.publicKey;p.challenge=buf(p.challenge);if(p.allowCredentials)p.allowCredentials.forEach(c=>c.id=buf(c.id));const c=await navigator.credentials.get({publicKey:p});if(!c)throw Error('操作已取消');await api('/api/auth/passkey/finish',{id:c.id,rawId:b64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,clientExtensionResults:c.getClientExtensionResults(),response:{clientDataJSON:b64(c.response.clientDataJSON),authenticatorData:b64(c.response.authenticatorData),signature:b64(c.response.signature),userHandle:c.response.userHandle?b64(c.response.userHandle):null}});await proceed()}catch(e){message(e.name==='NotAllowedError'?'通行密钥操作已取消或超时。':e.message)}finally{b.disabled=false}};
(async()=>{try{const session=await api('/api/auth/session');if(!session.authenticated)return;if(requestId){const check=await api('/api/auth/context?id='+encodeURIComponent(requestId));if(check.reauthenticate){$('email').value=session.user.email;return}}const user=session.user;$('current-name').textContent=user.name;$('current-email').textContent=user.email;$('session').classList.remove('hidden');$('form').classList.add('hidden');if(requestId){const context=await api('/api/auth/context?id='+encodeURIComponent(requestId));const fields=['用户标识'];if(context.scopes.includes('profile'))fields.push('昵称、头像');if(context.scopes.includes('email'))fields.push('邮箱');if(context.scopes.includes('offline_access'))fields.push('本次会话期间续期登录');$('scope-note').textContent='继续后，'+context.name+' 将获得：'+fields.join('、')+'。'}else{$('scope-note').classList.add('hidden')}}catch{}})();

let qrID='',qrEpoch=0,qrPollTimer,qrClockTimer;
function stopQR(){clearTimeout(qrPollTimer);clearInterval(qrClockTimer);qrEpoch++;if(qrID){api('/api/auth/qr/'+qrID+'/cancel',{}).catch(()=>{});qrID=''}}
async function startQR(){stopQR();const epoch=qrEpoch;$('form').classList.add('hidden');$('qr-panel').classList.remove('hidden');$('heading').textContent='扫码登录';$('qr-image').classList.add('hidden');$('qr-refresh').classList.add('hidden');$('qr-local').classList.add('hidden');$('qr-status').textContent='正在生成二维码…';$('qr-code-label').textContent='';message('');try{const out=await api('/api/auth/qr',{});if(epoch!==qrEpoch){api('/api/auth/qr/'+out.id+'/cancel',{}).catch(()=>{});return}qrID=out.id;$('qr-image').src=out.image;$('qr-image').classList.remove('hidden');$('qr-code-label').textContent='识别码 '+out.label;$('qr-local').classList.toggle('hidden',!out.local_only);let scanned=false;const deadline=Date.parse(out.expires_at);function expired(text){clearTimeout(qrPollTimer);clearInterval(qrClockTimer);$('qr-status').textContent=text;$('qr-refresh').classList.remove('hidden')}function tick(){const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){expired('二维码已过期');return}$('qr-status').textContent=scanned?'已扫码，请在手机验证并确认':'使用 iPhone 系统相机扫码 · '+left+' 秒后过期'}tick();qrClockTimer=setInterval(tick,1000);async function poll(){if(epoch!==qrEpoch||Date.now()>=deadline)return;try{const state=await api('/api/auth/qr/'+out.id+'/poll',{});if(epoch!==qrEpoch)return;if(state.status==='approved'){qrID='';stopQR();await proceed();return}if(state.status==='expired'||state.status==='rejected'){expired(state.status==='rejected'?'手机已拒绝此次登录':'二维码已过期');return}scanned=state.status==='scanned';tick();qrPollTimer=setTimeout(poll,1800)}catch(e){if(epoch===qrEpoch)expired(e.message)}}qrPollTimer=setTimeout(poll,1800)}catch(e){if(epoch===qrEpoch){$('qr-status').textContent=e.message;$('qr-refresh').classList.remove('hidden')}}}
$('qr-open').onclick=startQR;$('qr-refresh').onclick=startQR;$('qr-back').onclick=()=>{stopQR();$('qr-panel').classList.add('hidden');$('form').classList.remove('hidden');select(mode)};window.addEventListener('pagehide',()=>{clearTimeout(qrPollTimer);clearInterval(qrClockTimer)});
</script></body></html>
