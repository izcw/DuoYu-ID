<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" /><link rel="icon" href="/favicon.ico"><title>确认登录 · 多鱼账号</title><link rel="stylesheet" href="{{assetURL `/auth/base.css`}}"><link rel="stylesheet" href="{{assetURL `/auth/scan.css`}}"></head><body><main class="card"><img src="/logo.png" alt="多鱼账号" style="width:64px;height:auto;border-radius:4px"><div class="brand">DUOYU ID</div><h1>确认电脑登录</h1><p id="origin"></p><p>请核对电脑页面上的识别码</p><div id="label" class="label">—</div><p id="status" role="status">正在检查二维码…</p><p id="account" class="account"></p><button id="verify" disabled>使用通行密钥验证</button><button id="approve" class="hidden">确认登录此电脑</button><button id="reject" class="secondary hidden">拒绝</button><p>需先在“账号与安全 → iPhone 扫码登录”添加手机通行密钥。仅确认你本人打开的登录页面。</p></main><script>
const $=id=>document.getElementById(id);const ticket=location.hash.slice(1);history.replaceState(null,'','/scan');
async function api(path,data){const r=await fetch(path,{method:data===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Duoyu-Request':'1'},body:data===undefined?undefined:JSON.stringify(data)});const out=await r.json();if(!r.ok)throw Error(out.msg||'请求失败');return out.data}
const buf=v=>Uint8Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const b64=v=>btoa(String.fromCharCode(...new Uint8Array(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
function error(e){$('status').textContent=e.name==='NotAllowedError'?'验证已取消。请先在“账号与安全 → iPhone 扫码登录”添加手机通行密钥，再重试。':e.message;$('status').className='error'}
$('verify').onclick=async()=>{const b=$('verify');b.disabled=true;try{if(!window.isSecureContext)throw Error('当前页面使用 HTTP，无法调用通行密钥。请通过 HTTPS 账号中心重新扫码验证。');if(typeof navigator.credentials?.get!=='function')throw Error('当前浏览器未提供通行密钥功能，请检查浏览器版本或安全策略。');await api('/api/auth/qr/context',{ticket});const o=await api('/api/auth/passkey/begin',{});const p=o.publicKey;p.challenge=buf(p.challenge);p.allowCredentials?.forEach(c=>c.id=buf(c.id));const c=await navigator.credentials.get({publicKey:p});if(!c)throw Error('验证已取消');await api('/api/auth/passkey/finish',{id:c.id,rawId:b64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,clientExtensionResults:c.getClientExtensionResults(),response:{clientDataJSON:b64(c.response.clientDataJSON),authenticatorData:b64(c.response.authenticatorData),signature:b64(c.response.signature),userHandle:c.response.userHandle?b64(c.response.userHandle):null}});const user=await api('/api/me');$('account').textContent=user.email;$('status').textContent='验证成功，请确认是否让这台电脑登录。';$('status').className='';b.classList.add('hidden');$('approve').classList.remove('hidden');$('reject').classList.remove('hidden')}catch(e){error(e);b.disabled=false}};
async function decide(reject){$('approve').disabled=true;$('reject').disabled=true;try{await api('/api/auth/qr/approve',{ticket,reject});$('status').textContent=reject?'已拒绝，可关闭本页。':'已确认，请返回电脑。';$('approve').classList.add('hidden');$('reject').classList.add('hidden')}catch(e){error(e);$('approve').disabled=false;$('reject').disabled=false}}
$('approve').onclick=()=>decide(false);$('reject').onclick=()=>decide(true);
(async()=>{try{const out=await api('/api/auth/qr/context',{ticket});$('label').textContent=out.label;$('origin').textContent=out.origin;$('status').textContent='使用 iPhone 上的通行密钥，通过 Face ID、Touch ID 或设备密码验证。';$('verify').disabled=false}catch(e){error(e)}})();
</script></body></html>
